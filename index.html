px;margin:15px 0}.metric{border:1px solid #e6edee;border-radius:13px;padding:14px;background:white}.metric small{display:block;font-size:11px;color:#8e9da5;margin-bottom:8px}.metric strong{font-size:21px;color:#28535b}.score{font-size:48px;font-weight:850;color:#2f6d65;letter-spacing:-2px}.bar{height:10px;border-radius:99px;background:#e6eff0;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:#3d9886}.rating{border:1px solid #e6edef;border-radius:13px;padding:15px;margin:10px 0}.ratinghead{display:flex;justify-content:space-between;gap:10px;align-items:center}.ratinghead strong{font-size:14px}.ratinghead span{font-size:11px;color:#819099}.rating p{color:#8a9aa1;font-size:11px;margin:6px 0 12px}.ratingopt{display:flex;gap:8px}.ratingopt button{flex:1;border:1px solid #dce6e9;background:#fff;border-radius:9px;padding:11px 0;color:#5e747d;font-weight:750}.ratingopt button.sel{background:#e4f2ed;border-color:#65a28f;color:#286d60}.notice{background:#f6f8f8;border-left:3px solid #8facad;padding:12px 14px;color:#60737c;font-size:12px;line-height:1.8;border-radius:7px}.notice.warn{background:#fff8e9;border-color:#e0ac5d;color:#826338}.comparebox{margin-top:16px;border:1px solid #e2e9ec;padding:16px;border-radius:12px;background:#fafcfc}.reviewbox{display:grid;gap:12px}.reviewrow{border-bottom:1px solid #ecf0f1;padding-bottom:12px}.reviewrow:last-child{border:0}.seg{display:flex;flex-wrap:wrap;gap:8px}.bottomnav{display:none}#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#263d45;color:#fff;border-radius:12px;padding:12px 22px;font-size:13px;box-shadow:0 12px 30px #0002;z-index:10;opacity:0;pointer-events:none;transition:opacity .15s}#toast.visible{opacity:1}.topalert{border:1px solid #f0d4a5;background:#fff7e9;color:#835927;padding:12px 16px;border-radius:13px;font-size:12px;margin-bottom:18px;line-height:1.7}.reviewdue{color:#936723;font-size:12px;font-weight:800}.subnav{display:flex;gap:9px;flex-wrap:wrap;ma </style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><span>◇</span><div>Life Value<small>Better decisions</small></div></div><nav class="nav" id="sidebar-nav"></nav><div class="sidehint">価格の安さより、暮らしにもたらす価値を。<br>データはこの端末内に保存されます。</div></aside><main class="content" id="main"><div class="pageheader"><h1>Life Value</h1></div></main></div><nav class="bottomnav" id="bottom-nav"></nav><div id="toast" role="status"></div><script type="module">export const VERSION='1.0.0';
export const WEIGHTS={stress:20,happiness:20,time:15,confidence:15,lasting:10,alternative:10,value:10};
export const CRITERIA=[
 ['stress','問題解決・ストレス軽減','日常の不満や不便をどれだけ解消しますか？'],
 ['happiness','幸福度・快適さ','楽しさや快適さはどれくらい改善しますか？'],
 ['time','時間・労力の節約','時間や面倒な作業をどれくらい減らせますか？'],
 ['confidence','使用継続の確実性','予想どおり使い続けられそうですか？'],
 ['lasting','長期的な価値','得られるメリットは長く続きますか？'],
 ['alternative','代替案との優位性','より安価な選択肢と比べて優れていますか？'],
 ['value','総費用の妥当性','支払う総額に見合う価値がありますか？']
];
export function nonnegative(v){const x=Number(v);return Number.isFinite(x)?Math.max(0,x):0;}
export function clamp(v,a,b){const x=Number(v);return Number.isFinite(x)?Math.min(b,Math.max(a,x)):a;}
export function yen(v){return new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(v||0);}
export function fmt(v,d=0){return new Intl.NumberFormat('ja-JP',{maximumFractionDigits:d}).format(v||0);}
export function monthsToYears(months){return nonnegative(months)/12;}
export function totalCost(d){
 const months=nonnegative(d.durationMonths);
 const initial=nonnegative(d.price);
 const recurring=nonnegative(d.recurringAmount);
 const period=d.recurringPeriod||'none';
 const rec=period==='monthly'?recurring*months:period==='yearly'?recurring*(months/12):0;
 const maintenance=nonnegative(d.maintenanceAnnual)*(months/12);
 const resale=nonnegative(d.resale);
 return Math.max(0, initial+rec+maintenance-Math.min(resale,initial+rec+maintenance));
}
export function usesCount(d){
 const cat=d.category||'durable';
 if(cat==='experience') return nonnegative(d.eventCount ?? 1);
 if(cat==='daily') return nonnegative(d.usePerWeek)*52*(nonnegative(d.durationMonths)/12);
 return nonnegative(d.usePerWeek)*52*(nonnegative(d.durationMonths)/12);
}
export function costMetrics(d){
 const total=totalCost(d);const count=usesCount(d);const days=nonnegative(d.durationMonths)*365.25/12;
 return {total,count,perUse:count>0?total/count:null,perDay:days>0?total/days:null};
}
export function scoreRatings(ratings,weights=WEIGHTS){
 const keys=Object.keys(WEIGHTS);
 if(!keys.every(k=>ratings && ratings[k]!==null && ratings[k]!==undefined && ratings[k]!=='' && Number.isInteger(Number(ratings[k])) && Number(ratings[k])>=0 && Number(ratings[k])<=4))return null;
 const sumWeight=keys.reduce((sum,k)=>sum+nonnegative(weights[k]),0);
 if(sumWeight<=0)return null;
 return Math.round(keys.reduce((sum,k)=>sum+nonnegative(weights[k])*Number(ratings[k])/4,0)*100/sumWeight);
}
export function recommendation(d,score=null){
 if(d.budget==='risk')return {label:'家計への影響を優先確認',tone:'warn',reason:'生活費・緊急時の備えに影響する場合は、購入価値が高くても無条件には勧められません。'};
 if(d.budget==='unknown')return {label:'家計への影響を確認',tone:'neutral',reason:'予算への影響が未確認です。まず購入後の家計を確認してください。'};
 if(d.budget==='caution')return {label:'資金計画を確認',tone:'warn',reason:'ほかの支出の調整が必要です。時期や代替案を検討してください。'};
 if(score!==null){
  if(score>=75)return {label:'前向きに購入を検討',tone:'good',reason:'生活価値は比較的高い評価です。ただし予測であり、購入後の満足を保証するものではありません。'};
  if(score>=50)return {label:'代替案と比較',tone:'neutral',reason:'一長一短があります。価格差、利用確度、現状維持の負担を比較してください。'};
  return {label:'優先順位を再検討',tone:'warn',reason:'期待できる改善が費用に見合うか、もう一度確認する余地があります。'};
 }
 if(d.certainty==='low')return {label:'使用見込みを確認',tone:'neutral',reason:'実際に使う頻度が不確かです。少し試すか購入を保留してみましょう。'};
 if(Number(d.impact)<=1)return {label:'購入価値を再検討',tone:'neutral',reason:'期待する改善が小さいため、ほかの支出と比較する価値があります。'};
 if(Number(d.impact)>=3 && nonnegative(d.usePerWeek)>=3 && d.certainty==='high' && d.category!=='experience')return {label:'前向きに購入を検討',tone:'good',reason:'使用頻度と期待改善度が高めです。代替品との違いも見て判断しましょう。'};
 return {label:'比較・詳細確認',tone:'neutral',reason:'価格だけではなく、代替案と生活上の改善度を比較しましょう。'};
}
export function makeDecision(raw){
 const now=new Date().toISOString();
 return {id:raw.id||('p-'+Date.now()+'-'+Math.random().toString(36).slice(2,9)),version:VERSION,createdAt:raw.createdAt||now,updatedAt:now,
 name:String(raw.name||'名称未設定').slice(0,120),category:raw.category||'durable',price:nonnegative(raw.price),recurringAmount:nonnegative(raw.recurringAmount),recurringPeriod:raw.recurringPeriod||'none',maintenanceAnnual:nonnegative(raw.maintenanceAnnual),resale:nonnegative(raw.resale),durationMonths:nonnegative(raw.durationMonths),usePerWeek:nonnegative(raw.usePerWeek),eventCount:nonnegative(raw.eventCount ?? 1),benefit:raw.benefit||'stress',impact:clamp(raw.impact??2,0,4),certainty:raw.certainty||'medium',budget:raw.budget||'unknown',alternatives:raw.alternatives||'unknown',ratings:raw.ratings||{},notes:String(raw.notes||'').slice(0,2000),status:raw.status||'considering',purchasedAt:raw.purchasedAt||null,actualPrice:raw.actualPrice===null||raw.actualPrice===undefined?null:nonnegative(raw.actualPrice),reviews:Array.isArray(raw.reviews)?raw.reviews:[]};
}
export function validateImported(data){
 if(!data||!Array.isArray(data.decisions)||data.decisions.length>10000)throw new Error('対応していないバックアップ形式です。');
 const categories=['durable','daily','subscription','service','experience'];
 for(const d of data.decisions){
  if(!d||typeof d.id!=='string'||typeof d.name!=='string'||!categories.includes(d.category)||!Number.isFinite(d.price)||d.price<0||!Array.isArray(d.reviews)||d.reviews.length>1000)throw new Error('バックアップのデータ形式に問題があります。');
 }
 return true;
}

const CATS={durable:'長く使うもの',daily:'日用品・消耗品',subscription:'サブスク',service:'サービス',experience:'旅行・体験'};
const BENEFITS={stress:'ストレス軽減',time:'時間の節約',comfort:'快適さ・幸福度',health:'健康・安全',family:'家族との時間',other:'その他'};
const STATUSES={considering:'検討中',postponed:'保留',purchased:'購入済み',rejected:'見送り'};
const LABELS={home:['⌂','ホーム'],quick:['＋','新規診断'],records:['▤','履歴'],settings:['⚙','設定']};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function newDraft(){return {...makeDecision({name:'',price:0,category:'durable',usePerWeek:7,durationMonths:48,impact:2,budget:'unknown',certainty:'medium',eventCount:1}),name:''};}
const app={page:'home',decisions:[],draft:newDraft(),selected:null,filter:'all',storage:'indexeddb',ready:false};
const main=document.querySelector('#main');
const toastEl=document.querySelector('#toast');let toastTimeout;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('visible');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>toastEl.classList.remove('visible'),3000);}
async function dbRequest(mode='read',value){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open('life-value-v1',1);
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('data'))req.result.createObjectStore('data');};
  req.onerror=()=>reject(req.error);
  req.onsuccess=()=>{
   const db=req.result;const tx=db.transaction('data',mode==='read'?'readonly':'readwrite');
   const op=mode==='read'?tx.objectStore('data').get('decisions'):tx.objectStore('data').put(value,'decisions');
   let result;op.onsuccess=()=>{result=op.result;};
   op.onerror=()=>reject(op.error);
   tx.oncomplete=()=>{db.close();resolve(result);};tx.onerror=()=>{db.close();reject(tx.error);};
  };
 });
}
async function loadData(){try{const value=await dbRequest();app.decisions=Array.isArray(value)?value:[];}catch(e){app.storage='local';try{app.decisions=JSON.parse(localStorage.getItem('life-value-decisions')||'[]');}catch{app.decisions=[];app.storage='temporary';}}app.ready=true;render();}
async function persist(){try{if(app.storage==='indexeddb')await dbRequest('write',app.decisions);else if(app.storage==='local')localStorage.setItem('life-value-decisions',JSON.stringify(app.decisions));else toast('保存できません。JSONでバックアップしてください。');}catch(e){toast('保存エラー。バックアップをお試しください。');}}
function header(kicker,title,description){return `<div class="pageheader"><div class="eyebrow">${kicker}</div><h1>${title}</h1>${description?`<div class="subtitle">${description}</div>`:''}</div>`;}
function navHtml(mobile){return Object.entries(LABELS).map(([key,[icon,label]])=>`<button data-nav="${key}" class="${(app.page===key||(app.page==='result'&&key==='records')||(app.page==='detail'&&key==='records')||(app.page==='review'&&key==='records'))?'active':''}"><span>${icon}</span>${label}</button>`).join('');}
function render(){
 document.querySelector('#sidebar-nav').innerHTML=navHtml(false);document.querySelector('#bottom-nav').innerHTML=navHtml(true);
 if(!app.ready){main.innerHTML=header('Loading','読み込み中','');return;}
 const views={home:homeView,quick:quickView,result:resultView,detail:detailView,records:recordsView,settings:settingsView,review:reviewView};
 main.innerHTML=(views[app.page]||homeView)();
}
function due(d){if(d.status!=='purchased'||!d.purchasedAt)return false;const days=Math.floor((new Date(today())-new Date(d.purchasedAt.slice(0,10)))/86400000);return (days>=30&&!d.reviews.some(r=>r.stage==='30'))||(days>=90&&!d.reviews.some(r=>r.stage==='90'));}
function itemRow(d){const rec=recommendation(d,scoreRatings(d.ratings));return `<button class="item" data-open="${escapeHtml(d.id)}"><span><strong>${escapeHtml(d.name)}</strong><span class="muted">${escapeHtml(CATS[d.category]||'その他')} · ${escapeHtml(STATUSES[d.status]||'検討中')} ${due(d)?'· <span class="reviewdue">振り返り対象</span>':''}</span></span><span class="itemright"><strong>${yen(d.price)}</strong><br><span class="tag ${rec.tone}">${escapeHtml(rec.label)}</span></span></button>`;}
function homeView(){const active=app.decisions.filter(d=>d.status==='considering'||d.status==='postponed').length;const purchased=app.decisions.filter(d=>d.status==='purchased').length;const dueReviews=app.decisions.filter(due).length;return `${header('LIFE VALUE','買い物を、もっと納得のいく選択に。','安いか高いかではなく、暮らしにもたらす価値で判断します。')}
 <div class="hero"><div style="font-size:11px;font-weight:800;letter-spacing:.14em;opacity:.8">MAKE EVERY PURCHASE COUNT</div><h2>その買い物、本当に<br>自分にとって価値がある？</h2><p>使用頻度、ストレス軽減、満足感、家計への影響。数字と生活実感の両方から考えてみましょう。</p><button class="btn white" data-nav="quick">＋ 新しい買い物を診断</button></div>
 <div class="statgrid"><div class="stat"><div class="label">検討中・保留</div><div class="value">${active}</div></div><div class="stat"><div class="label">購入済み</div><div class="value">${purchased}</div></div><div class="stat"><div class="label">振り返り対象</div><div class="value">${dueReviews}</div></div></div>
 <div class="sectiontitle"><h2>最近の買い物候補</h2><button class="textbutton" data-nav="records">すべて見る →</button></div><div class="items">${app.decisions.length?app.decisions.slice().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).slice(0,5).map(itemRow).join(''):'<div class="empty">まだ記録はありません。<br>最初の買い物候補を診断しましょう。</div>'}</div>
 <div class="sectiontitle"><h2>Life Value の考え方</h2></div><div class="grid2"><div class="surface"><b>① 買う価値</b><p class="subtitle">日々の快適さ・時間・ストレスの改善を評価。</p></div><div class="surface"><b>② 買わないコスト</b><p class="subtitle">現状の不便や繰り返す支出も見落とさない。</p></div></div>`;}
function inputField(label,field,type='number',hint='',extra=''){const d=app.draft;return `<div class="field"><label for="f-${field}">${label}</label><input id="f-${field}" data-field="${field}" type="${type}" ${type==='number'?'min="0" step="any"':''} value="${escapeHtml(d[field]??'')}" ${extra}>${hint?`<div class="hint">${hint}</div>`:''}</div>`;}
function selectField(label,field,opts,hint=''){return `<div class="field"><label for="f-${field}">${label}</label><select id="f-${field}" data-field="${field}">${opts.map(([v,l])=>`<option value="${escapeHtml(v)}" ${String(app.draft[field])===String(v)?'selected':''}>${escapeHtml(l)}</option>`).join('')}</select>${hint?`<div class="hint">${hint}</div>`:''}</div>`;}
function quickView(){const d=app.draft;return `${header('QUICK CHECK',app.selected?'診断内容を編集':'クイック診断','まずは必要な情報だけ。あとから何度でも編集できます。')}
 <div class="surface sectionbox"><h3>何を購入しますか？</h3><p class="subtitle">名前と金額から始めましょう。</p><div class="formgrid">
 ${inputField('商品・サービス名','name','text','例：仕事用の椅子、旅行、家事代行')}
 ${selectField('購入カテゴリー','category',Object.entries(CATS))}
 ${inputField('購入価格（円）','price','number',d.category==='subscription'?'初期費用がなければ0円':'最初に支払う金額')}
 ${selectField('継続支払い','recurringPeriod',[['none','なし'],['monthly','毎月'],['yearly','毎年']])}
 ${d.recurringPeriod!=='none'?inputField('継続料金（円）','recurringAmount','number'):''}
 ${inputField('利用予定期間（か月）','durationMonths','number','例：3年なら36、5年なら60')}
 ${d.category==='experience'?inputField('体験予定回数','eventCount','number','旅行が1回なら1'):inputField('1週間の使用予定回数','usePerWeek','number','毎日なら7、月1回なら約0.25')}
 </div></div>
 <div class="surface sectionbox"><h3>生活はどう変わりますか？</h3><p class="subtitle">理想ではなく、現実的に期待できる効果で評価します。</p><div class="formgrid">
 ${selectField('期待する最大の効果','benefit',Object.entries(BENEFITS))}
 ${selectField('改善の大きさ','impact',[[0,'0：ほぼ変わらない'],[1,'1：少し'],[2,'2：ある程度'],[3,'3：かなり'],[4,'4：生活が大きく改善']])}
 ${selectField('使用見込みの確実性','certainty',[['high','高い：使う場面が明確'],['medium','普通：ある程度予測できる'],['low','低い：続くか不安']])}
 ${selectField('家計への影響','budget',[['unknown','まだ確認していない'],['safe','無理なく支払える'],['caution','ほかの支出の調整が必要'],['risk','生活費や緊急時の備えに影響']])}
 ${selectField('安い代替案はある？','alternatives',[['unknown','未確認'],['yes','ある'],['no','探したが見つからない']])}
 </div></div>
 <div class="footactions"><button class="btn" data-action="save">記録を保存</button><button class="btn primary" data-action="quick-result">診断結果を見る →</button></div>`;}
function resultView(){const d=app.draft;const metrics=costMetrics(d);const s=scoreRatings(d.ratings);const rec=recommendation(d,s);return `${header('RESULT','診断結果','点数は生活価値の目安です。ご自身の判断を補助するためにご利用ください。')}
 <div class="resultbanner"><span class="tag ${rec.tone}">${s===null?'簡易判定':'詳細判定'}</span><h2>${escapeHtml(rec.label)}</h2><p class="subtitle" style="color:inherit">${escapeHtml(rec.reason)}</p><div style="font-size:13px;margin-top:12px;font-weight:800">${escapeHtml(d.name)}</div></div>
 <div class="metricgrid"><div class="metric"><small>支払う総費用（概算）</small><strong>${yen(metrics.total)}</strong></div><div class="metric"><small>1回当たり</small><strong>${metrics.perUse===null?'算出不可':yen(metrics.perUse)}</strong></div><div class="metric"><small>1日当たり</small><strong>${metrics.perDay===null?'算出不可':yen(metrics.perDay)}</strong></div></div>
 ${d.category==='experience'?'<div class="notice">体験型の買い物では「1日当たり」は参考値です。体験自体の幸福価値を重視して判断します。</div>':''}
 ${d.budget==='risk'?'<div class="notice warn" style="margin-top:12px">家計リスクが高いため、点数が高くても購入推奨にはなりません。</div>':''}
 <div class="sectiontitle"><h2>今回の判断材料</h2></div><div class="surface"><div class="grid2"><div><div class="muted">期待する効果</div><b>${escapeHtml(BENEFITS[d.benefit]||'その他')}</b></div><div><div class="muted">改善の大きさ</div><b>${Number(d.impact)}/4</b></div><div><div class="muted">使用の確実性</div><b>${d.certainty==='high'?'高い':d.certainty==='low'?'低い':'普通'}</b></div><div><div class="muted">代替案</div><b>${d.alternatives==='yes'?'あり':d.alternatives==='no'?'見つからない':'未確認'}</b></div></div>
 ${s!==null?`<div style="margin-top:18px"><span class="muted">詳細評価</span><div class="score">${s}<span style="font-size:16px">/100</span></div><div class="bar"><span style="width:${s}%"></span></div></div>`:'<p class="subtitle" style="margin-bottom:0">詳細スコアはまだ算出していません。詳細分析で7項目を採点できます。</p>'}</div>
 <div class="sectiontitle"><h2>次にできること</h2></div><div class="btnrow"><button class="btn primary" data-nav="detail">詳細分析する →</button><button class="btn" data-action="edit">入力を修正</button><button class="btn light" data-action="save">記録を保存</button></div>
 <div class="sectiontitle"><h2>購入状況</h2></div><div class="btnrow"><button class="btn small" data-status="considering">検討中</button><button class="btn small" data-status="postponed">保留</button><button class="btn small" data-status="purchased">購入済みにする</button><button class="btn small" data-status="rejected">見送り</button>${d.status==='purchased'?'<button class="btn small primary" data-nav="review">購入後レビューを記録</button>':''}</div>
 <div class="notice" style="margin-top:20px">年間維持費、将来の売却価値、代替品との価格差も評価する場合は、詳細分析画面で入力できます。データはこの端末に保存されます。</div>`;}
function detailView(){const d=app.draft;const score=scoreRatings(d.ratings);return `${header('DEEP ANALYSIS','詳細分析','それぞれ0〜4点で評価します。すべて入力すると100点満点で計算します。')}
 <div class="surface"><div class="topright"><b>${escapeHtml(d.name)}</b><span class="tag">${yen(d.price)}</span></div>
 ${CRITERIA.map(([key,title,hint])=>`<div class="rating"><div class="ratinghead"><strong>${title}</strong><span>配点 ${WEIGHTS[key]}点</span></div><p>${hint}</p><div class="ratingopt">${[0,1,2,3,4].map(i=>`<button data-rating="${key}" data-value="${i}" class="${Number(d.ratings?.[key])===i&&d.ratings?.[key]!==undefined?'sel':''}" aria-label="${title} ${i}点" aria-pressed="${Number(d.ratings?.[key])===i&&d.ratings?.[key]!==undefined?'true':'false'}">${i}</button>`).join('')}</div></div>`).join('')}
 <div class="muted">0：効果なし・不利 ／ 2：普通 ／ 4：大きな効果・明確に優位</div>
 <div class="resultbanner" style="margin-top:18px"><div class="eyebrow">総合評価</div><div class="score">${score===null?'—':score}<span style="font-size:17px"> / 100</span></div><div class="bar"><span style="width:${score??0}%"></span></div><p class="subtitle" style="color:inherit;margin-bottom:0">${score===null?'未入力の評価項目があります。':'点数は独自の意思決定支援モデルです。'}</p></div></div>
 <div class="surface sectionbox"><h3>費用と代替案を詳しく計算</h3><p class="subtitle">わかる範囲だけで構いません。</p><div class="formgrid">${inputField('年間維持費（円）','maintenanceAnnual','number','消耗品、保険、電気代など')}${inputField('売却見込額（円）','resale','number','不明な場合は0円')}</div><div class="field" style="margin-top:16px"><label>購入する理由・比較したい代替品など</label><textarea data-field="notes">${escapeHtml(d.notes)}</textarea></div></div>
 <div class="footactions"><button class="btn" data-action="save">保存</button><button class="btn primary" data-action="detail-result">分析結果を見る →</button></div>`;}
function recordsView(){let arr=app.decisions.slice().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));if(app.filter!=='all')arr=arr.filter(d=>d.status===app.filter);return `${header('HISTORY','購入判断の履歴','過去の検討内容を再表示・編集できます。')}
 <div class="subnav">${[['all','すべて'],...Object.entries(STATUSES)].map(([k,label])=>`<button data-filter="${k}" class="${app.filter===k?'selected':''}">${label}</button>`).join('')}</div>
 <div class="items">${arr.length?arr.map(itemRow).join(''):'<div class="empty">該当する記録はありません。</div>'}</div>`;}
function settingsView(){return `${header('SETTINGS','設定・バックアップ','大切な記録は定期的に書き出して保存してください。')}
 <div class="surface sectionbox"><h3>データのバックアップ</h3><p class="subtitle">このアプリの記録はサーバーへ送信せず、端末内に保存されます。ブラウザのデータ削除・端末変更で消えることがあります。</p><div class="btnrow"><button class="btn primary" data-action="export-json">JSONでバックアップ</button><button class="btn" data-action="export-csv">CSVで書き出し</button><button class="btn" data-action="import-click">バックアップを読み込む</button><input type="file" id="importfile" class="filepick" accept=".json,application/json"></div></div>
 <div class="surface sectionbox"><h3>プライバシーと保存</h3><p class="subtitle">保存方式：${app.storage==='indexeddb'?'IndexedDB（端末内）':app.storage==='local'?'ローカル保存（端末内）':'一時保存のみ'}<br>アプリのコードは公開ホスティング可能ですが、購入記録は公開されません。別の端末とは同期されません。</p><button class="btn danger" data-action="delete-all">すべての記録を削除</button></div>
 <div class="surface sectionbox"><h3>評価ロジック</h3><p class="subtitle">問題解決20 / 幸福度20 / 時間15 / 使用確度15 / 長期価値10 / 代替比較10 / 総費用10。すべて0〜4の尺度を利用し、100点満点に換算します。科学的に検証された予測値ではありません。</p><p class="muted">Life Value v${VERSION} · API料金不要 · オフライン対応</p></div>`;}
function reviewView(){const d=app.draft;const days=d.purchasedAt?Math.max(0,Math.floor((new Date(today())-new Date(d.purchasedAt.slice(0,10)))/86400000)):0;const stage=days>=90&&!d.reviews.some(r=>r.stage==='90')?'90':days>=30&&!d.reviews.some(r=>r.stage==='30')?'30':'custom';return `${header('REVIEW','購入後の振り返り','予想と実績を比較し、自分の支出傾向を把握します。')}
 <div class="surface"><h3>${escapeHtml(d.name)}</h3><p class="subtitle">購入から約${days}日 · 過去のレビュー ${d.reviews.length}件</p><div class="formgrid">
 <div class="field"><label>今回の評価タイミング</label><select id="reviewstage"><option value="${stage}">${stage==='30'?'30日後':stage==='90'?'90日後':'任意の振り返り'}</option><option value="custom">任意の振り返り</option></select></div>
 <div class="field"><label>実際の満足度</label><select id="reviewsatisfaction">${[0,1,2,3,4].map(i=>`<option value="${i}" ${i===2?'selected':''}>${i} / 4</option>`).join('')}</select></div>
 <div class="field"><label>実際の週使用回数</label><input id="reviewfrequency" type="number" min="0" step="any" value="${escapeHtml(d.usePerWeek)}"></div>
 <div class="field"><label>総合的な感想</label><select id="reviewverdict"><option value="good">買ってよかった</option><option value="neutral">どちらともいえない</option><option value="bad">買わなくてもよかった</option></select></div>
 <div class="field full"><label>振り返りメモ</label><textarea id="reviewnotes" placeholder="予想と違ったこと・実際に感じた価値など"></textarea></div></div>
 <div class="footactions"><button class="btn" data-nav="result">戻る</button><button class="btn primary" data-action="save-review">振り返りを保存</button></div></div>
 ${d.reviews.length?`<div class="sectiontitle"><h2>これまでのレビュー</h2></div><div class="surface reviewbox">${d.reviews.slice().reverse().map(r=>`<div class="reviewrow"><b>${escapeHtml(r.date||'')} · 満足度 ${Number(r.satisfaction)||0}/4</b><p class="subtitle">${escapeHtml(r.notes||'メモなし')}</p></div>`).join('')}</div>`:''}`;}
function nav(page){app.page=page;if(page==='quick'){app.selected=null;app.draft=newDraft();}render();window.scrollTo(0,0);}
async function save(){if(!String(app.draft.name||'').trim()){toast('商品・サービス名を入力してください。');app.page='quick';render();document.querySelector('#f-name')?.focus();return false;}const d=makeDecision(app.draft);app.draft=d;const idx=app.decisions.findIndex(x=>x.id===d.id);if(idx>=0)app.decisions[idx]=d;else app.decisions.unshift(d);app.selected=d.id;await persist();toast('保存しました');return true;}
function updateField(field,value){const numeric=['price','recurringAmount','durationMonths','usePerWeek','maintenanceAnnual','resale','eventCount','impact'];app.draft[field]=numeric.includes(field)?(value===''?'':nonnegative(value)):value;}
async function changeStatus(status){if(!await save())return;app.draft.status=status;if(status==='purchased'){app.draft.purchasedAt=app.draft.purchasedAt||today();app.draft.actualPrice=app.draft.actualPrice??app.draft.price;}await save();render();toast('購入状況を更新しました');}
function downloadBlob(content,name,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
async function handleAction(action){
 if(action==='edit'){app.page='quick';render();window.scrollTo(0,0);return;}
 if(action==='quick-result'||action==='detail-result'){if(!String(app.draft.name||'').trim()){toast('商品・サービス名を入力してください。');app.page='quick';render();return;}app.page='result';render();window.scrollTo(0,0);return;}
 if(action==='save'){await save();return;}
 if(action==='export-json'){downloadBlob(JSON.stringify({app:'Life Value',version:VERSION,exportedAt:new Date().toISOString(),decisions:app.decisions},null,2),'life-value-backup-'+today()+'.json','application/json');toast('バックアップを書き出しました');return;}
 if(action==='export-csv'){const cols=['name','category','price','status','budget','updatedAt'];const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';const csv='\ufeff'+cols.join(',')+'\r\n'+app.decisions.map(d=>cols.map(k=>quote(d[k])).join(',')).join('\r\n');downloadBlob(csv,'life-value-records-'+today()+'.csv','text/csv;charset=utf-8');return;}
 if(action==='import-click'){document.querySelector('#importfile')?.click();return;}
 if(action==='delete-all'){if(confirm('すべての購入記録を削除しますか？この操作は取り消せません。')){app.decisions=[];app.selected=null;app.draft=newDraft();await persist();toast('記録を削除しました');render();}return;}
 if(action==='save-review'){
  const r={date:today(),stage:document.querySelector('#reviewstage').value,satisfaction:Number(document.querySelector('#reviewsatisfaction').value),usePerWeek:nonnegative(document.querySelector('#reviewfrequency').value),verdict:document.querySelector('#reviewverdict').value,notes:document.querySelector('#reviewnotes').value.slice(0,2000)};
  app.draft.reviews=[...(app.draft.reviews||[]),r];await save();app.page='result';render();toast('振り返りを保存しました');return;
 }
}
document.addEventListener('click',async event=>{
 const target=event.target.closest('[data-nav],[data-action],[data-open],[data-status],[data-rating],[data-filter]');if(!target)return;
 if(target.dataset.nav){nav(target.dataset.nav);return;}
 if(target.dataset.open){const d=app.decisions.find(x=>x.id===target.dataset.open);if(d){app.selected=d.id;app.draft=structuredClone(d);nav('result');}return;}
 if(target.dataset.rating){app.draft.ratings={...app.draft.ratings,[target.dataset.rating]:Number(target.dataset.value)};render();return;}
 if(target.dataset.filter){app.filter=target.dataset.filter;render();return;}
 if(target.dataset.status){await changeStatus(target.dataset.status);return;}
 if(target.dataset.action)await handleAction(target.dataset.action);
});
document.addEventListener('input',e=>{const field=e.target.dataset.field;if(field){updateField(field,e.target.value);}});
document.addEventListener('change',async e=>{
 const field=e.target.dataset.field;if(field){updateField(field,e.target.value);if(['category','recurringPeriod'].includes(field))render();}
 if(e.target.id==='importfile'){
  const file=e.target.files[0];if(!file)return;
  try{if(file.size>8*1024*1024)throw new Error('ファイルが大きすぎます。');const data=JSON.parse(await file.text());validateImported(data);
   if(!confirm(`${data.decisions.length}件の記録を読み込みます。現在のデータは置き換わります。先にバックアップしましたか？`))return;
   app.decisions=data.decisions;await persist();toast('読み込みました');nav('records');
  }catch(err){alert('読み込めませんでした：'+err.message);}finally{e.target.value='';}
 }
});
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));}
loadData();
